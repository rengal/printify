<template id="import-document-dialog-template">
    <div class="modal-overlay" data-import-dialog-overlay>
        <div class="modal" style="max-width: 560px;">
            <div class="modal-header" style="display: flex; align-items: center; justify-content: space-between;">
                <span>Import Document</span>
                <button class="icon-btn" data-import-dialog-close title="Close">
                    <img src="assets/icons/x.svg" width="18" height="18" alt="Close" class="themed-icon">
                </button>
            </div>
            <div class="modal-body">
                <p class="import-dialog-description">
                    Paste base64-encoded document bytes or drop / select a binary file.
                    The data will be fed directly into the printer's processing pipeline.
                </p>

                <div class="import-drop-zone" data-import-drop-zone>
                    <div class="import-drop-zone-idle" data-import-drop-idle>
                        <img src="assets/icons/log-in.svg" width="24" height="24" alt="" class="themed-icon import-drop-icon">
                        <span class="import-drop-label">Drop a file here or</span>
                        <label class="btn btn-secondary btn-sm import-file-label">
                            Browse
                            <input type="file" data-import-file-input style="display: none;">
                        </label>
                    </div>
                    <div class="import-drop-zone-active" data-import-drop-active style="display: none;">
                        <img src="assets/icons/log-in.svg" width="28" height="28" alt="" class="themed-icon">
                        <span>Release to attach</span>
                    </div>
                    <div class="import-file-info" data-import-file-info style="display: none;">
                        <img src="assets/icons/file-text.svg" width="16" height="16" alt="" class="themed-icon">
                        <span data-import-file-name class="import-file-name"></span>
                        <button class="btn-ghost btn-xs import-file-clear" data-import-file-clear title="Clear file">
                            <img src="assets/icons/x.svg" width="12" height="12" alt="Clear" class="themed-icon">
                        </button>
                    </div>
                </div>

                <div class="import-divider">
                    <span class="import-divider-text">or paste base64</span>
                </div>

                <div class="field">
                    <textarea
                        class="input import-base64-input"
                        data-import-base64-input
                        placeholder="SGVsbG8gV29ybGQ="
                        rows="6"
                        spellcheck="false"
                        autocomplete="off"
                    ></textarea>
                    <div class="field-error" data-import-base64-error></div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-secondary" data-import-dialog-cancel>Cancel</button>
                    <button class="btn btn-primary" data-import-dialog-submit>Import</button>
                </div>
            </div>
        </div>
    </div>
</template>
