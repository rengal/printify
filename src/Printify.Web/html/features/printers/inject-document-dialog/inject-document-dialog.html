<template id="inject-document-dialog-template">
    <div class="modal-overlay" data-inject-dialog-overlay>
        <div class="modal" style="max-width: 560px;">
            <div class="modal-header" style="display: flex; align-items: center; justify-content: space-between;">
                <span>Inject Document</span>
                <button class="icon-btn" data-inject-dialog-close title="Close">
                    <img src="assets/icons/x.svg" width="18" height="18" alt="Close" class="themed-icon">
                </button>
            </div>
            <div class="modal-body">
                <p class="inject-dialog-description">
                    Paste base64-encoded document bytes or drop / select a binary file.
                    The data will be fed directly into the printer's processing pipeline.
                </p>

                <div class="inject-drop-zone" data-inject-drop-zone>
                    <div class="inject-drop-zone-idle" data-inject-drop-idle>
                        <img src="assets/icons/log-in.svg" width="24" height="24" alt="" class="themed-icon inject-drop-icon">
                        <span class="inject-drop-label">Drop a file here or</span>
                        <label class="btn btn-secondary btn-sm inject-file-label">
                            Browse
                            <input type="file" data-inject-file-input style="display: none;">
                        </label>
                    </div>
                    <div class="inject-drop-zone-active" data-inject-drop-active style="display: none;">
                        <img src="assets/icons/log-in.svg" width="28" height="28" alt="" class="themed-icon">
                        <span>Release to attach</span>
                    </div>
                    <div class="inject-file-info" data-inject-file-info style="display: none;">
                        <img src="assets/icons/file-text.svg" width="16" height="16" alt="" class="themed-icon">
                        <span data-inject-file-name class="inject-file-name"></span>
                        <button class="btn-ghost btn-xs inject-file-clear" data-inject-file-clear title="Clear file">
                            <img src="assets/icons/x.svg" width="12" height="12" alt="Clear" class="themed-icon">
                        </button>
                    </div>
                </div>

                <div class="inject-divider">
                    <span class="inject-divider-text">or paste base64</span>
                </div>

                <div class="field">
                    <textarea
                        class="input inject-base64-input"
                        data-inject-base64-input
                        placeholder="SGVsbG8gV29ybGQ="
                        rows="6"
                        spellcheck="false"
                        autocomplete="off"
                    ></textarea>
                    <div class="field-error" data-inject-base64-error></div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-secondary" data-inject-dialog-cancel>Cancel</button>
                    <button class="btn btn-primary" data-inject-dialog-submit>Inject</button>
                </div>
            </div>
        </div>
    </div>
</template>
