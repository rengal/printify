<template id="printer-dialogue-template">
    <div class="modal-overlay" data-printer-dialogue-overlay>
        <div class="modal printer-dialog">
            <div class="printer-dialog-header">
                <h2 data-printer-dialogue-title>Printer Settings</h2>
                <button class="btn-close" data-printer-dialogue-close aria-label="Close">
                    <img class="themed-icon" src="assets/icons/x.svg" width="20" height="20" alt="">
                </button>
            </div>

            <div class="printer-dialog-content-wrapper">
                <nav class="printer-dialog-nav">
                    <button class="printer-dialog-nav-item active" data-tab="general">
                        <img class="themed-icon" src="assets/icons/settings.svg" width="18" height="18" alt="">
                        General
                    </button>
                    <button class="printer-dialog-nav-item" data-tab="buffer">
                        <img class="themed-icon" src="assets/icons/activity.svg" width="18" height="18" alt="">
                        Buffer Emulation
                    </button>
                    <button class="printer-dialog-nav-item" data-tab="quality">
                        <img class="themed-icon" src="assets/icons/help-circle.svg" width="18" height="18" alt="">
                        Quality Emulation
                    </button>
                    <div class="printer-dialog-nav-divider"></div>
                    <button class="printer-dialog-nav-item danger" data-tab="danger">
                        <img class="themed-icon" src="assets/icons/trash-2.svg" width="18" height="18" alt="">
                        Danger Zone
                    </button>
                </nav>

                <div class="printer-dialog-content">
                    <div class="printer-dialog-tab-content active" data-content="general">
                        <div class="settings-section">
                            <h3>General Settings</h3>
                            <div class="field">
                                <label class="label" for="printer-dialogue-name">Name</label>
                                <input
                                    class="input"
                                    id="printer-dialogue-name"
                                    data-printer-dialogue-name-input
                                    placeholder="e.g., Kitchen Printer"
                                />
                                <div class="field-error" data-printer-dialogue-name-error>Name is required</div>
                            </div>

                            <div class="field">
                                <label class="label" for="printer-dialogue-protocol">Protocol</label>
                                <select
                                    class="input"
                                    id="printer-dialogue-protocol"
                                    data-printer-dialogue-protocol-input
                                >
                                    <option value="" disabled selected>Select protocol</option>
                                    <option value="escpos">ESC/POS emulation</option>
                                    <option value="epl">EPL emulation</option>
                                </select>
                                <div class="field-hint" data-printer-dialogue-protocol-hint></div>
                            </div>

                            <div class="printer-dimensions-grid" data-printer-dialogue-dimensions-group>
                                <div class="field">
                                    <label class="label" for="printer-dialogue-width">Page width (dots)</label>
                                    <input
                                        class="input input-short"
                                        id="printer-dialogue-width"
                                        data-printer-dialogue-width-input
                                        type="number"
                                        placeholder="Width"
                                    />
                                </div>
                                <div class="field" data-printer-dialogue-height-field>
                                    <label class="label" for="printer-dialogue-height">Page height (dots)</label>
                                    <input
                                        class="input input-short"
                                        id="printer-dialogue-height"
                                        data-printer-dialogue-height-input
                                        type="number"
                                        placeholder="Height"
                                    />
                                </div>
                            </div>

                            <div class="info-box danger-ack-box" data-printer-dialogue-dimensions-ack-section>
                                <img class="themed-icon" src="assets/icons/alert-triangle.svg" width="18" height="18" alt="">
                                <div>
                                    <label class="printer-ack-label" for="printer-dialogue-dimensions-ack">
                                        <input
                                            type="checkbox"
                                            id="printer-dialogue-dimensions-ack"
                                            data-printer-dialogue-dimensions-ack-input
                                        />
                                        <span>
                                            I understand this printer uses raw TCP connection without encryption and transmitted data may
                                            be intercepted or modified. This is for testing/development only. I will not send sensitive
                                            data to this printer.
                                            <br>
                                            <a href="/docs/security" target="_blank">Learn more</a>
                                        </span>
                                    </label>
                                    <div class="field-error" data-printer-dialogue-dimensions-ack-error>
                                        You must acknowledge the security notice
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="printer-dialog-tab-content" data-content="buffer">
                        <div class="settings-section">
                            <h3>Buffer Emulation</h3>
                            <label class="printer-toggle-label" data-printer-dialogue-emulate-buffer-field>
                                <input type="checkbox" data-printer-dialogue-emulate-buffer-input />
                                Emulate buffer capacity
                            </label>

                            <div class="printer-buffer-grid" data-printer-dialogue-buffer-fields>
                                <div class="field">
                                    <label class="label" for="printer-dialogue-buffer-size">Buffer size (bytes)</label>
                                    <input
                                        class="input input-short"
                                        id="printer-dialogue-buffer-size"
                                        data-printer-dialogue-buffer-size-input
                                        type="number"
                                        value="4096"
                                    />
                                </div>
                                <div class="field">
                                    <label class="label" for="printer-dialogue-drain-rate">Drain rate (bytes/s)</label>
                                    <input
                                        class="input input-short"
                                        id="printer-dialogue-drain-rate"
                                        data-printer-dialogue-drain-rate-input
                                        type="number"
                                        value="2048"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="printer-dialog-tab-content" data-content="quality">
                        <div class="settings-section">
                            <h3>Quality Emulation</h3>
                            <p class="tab-placeholder">Quality degradation scenarios will be added here later.</p>
                        </div>
                    </div>

                    <div class="printer-dialog-tab-content" data-content="danger">
                        <div class="settings-section danger-section">
                            <h3>Danger Zone</h3>
                            <p class="danger-description">These actions are destructive and cannot be undone.</p>
                            <div class="danger-actions">
                                <button class="btn btn-danger" data-printer-dialogue-clear-documents>
                                    <img
                                        class="themed-icon"
                                        src="assets/icons/trash-2.svg"
                                        width="16"
                                        height="16"
                                        alt=""
                                    >
                                    Delete All Documents
                                </button>
                                <button class="btn btn-danger" data-printer-dialogue-delete-printer>
                                    <img class="themed-icon" src="assets/icons/trash.svg" width="16" height="16" alt="">
                                    Delete Printer
                                </button>
                            </div>
                            <div class="field-hint" data-printer-dialogue-danger-hint>
                                Save the printer first to enable danger actions.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer printer-dialog-footer">
                <button class="btn btn-secondary" data-printer-dialogue-cancel>Cancel</button>
                <button class="btn btn-primary" data-printer-dialogue-submit disabled>Create Printer</button>
            </div>
        </div>
    </div>
</template>
