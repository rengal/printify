<template id="workspace-settings-dialog-template">
    <div class="modal-overlay" data-workspace-settings-overlay>
        <div class="modal workspace-settings-dialog">
            <div class="workspace-settings-header">
                <h2>Workspace Settings</h2>
                <button class="btn-close" data-workspace-settings-close aria-label="Close">
                    <img class="themed-icon" src="assets/icons/x.svg" width="20" height="20" alt="">
                </button>
            </div>

            <div class="workspace-settings-content-wrapper">
                <!-- Vertical Sidebar Navigation -->
                <nav class="workspace-settings-nav">
                    <button class="workspace-settings-nav-item active" data-tab="general">
                        <img class="themed-icon" src="assets/icons/settings.svg" width="18" height="18" alt="">
                        General
                    </button>
                    <button class="workspace-settings-nav-item" data-tab="retention">
                        <img class="themed-icon" src="assets/icons/clock.svg" width="18" height="18" alt="">
                        Retention Policy
                    </button>
                    <button class="workspace-settings-nav-item" data-tab="whitelist">
                        <img class="themed-icon" src="assets/icons/shield.svg" width="18" height="18" alt="">
                        IP Whitelist
                    </button>
                    <button class="workspace-settings-nav-item" data-tab="connections">
                        <img class="themed-icon" src="assets/icons/list.svg" width="18" height="18" alt="">
                        Access Log
                    </button>
                    <button class="workspace-settings-nav-item" data-tab="usage">
                        <img class="themed-icon" src="assets/icons/bar-chart-2.svg" width="18" height="18" alt="">
                        Usage & Statistics
                    </button>
                    <button class="workspace-settings-nav-item" data-tab="admin" data-admin-statistics-tab hidden>
                        <img class="themed-icon" src="assets/icons/shield.svg" width="18" height="18" alt="">
                        Admin
                    </button>
                    <div class="workspace-settings-nav-divider"></div>
                    <button class="workspace-settings-nav-item danger" data-tab="danger">
                        <img class="themed-icon" src="assets/icons/trash-2.svg" width="18" height="18" alt="">
                        Danger Zone
                    </button>
                </nav>

                <!-- Tab Content -->
                <div class="workspace-settings-content">
                    <!-- General Tab -->
                    <div class="workspace-settings-tab-content active" data-content="general">
                        <div class="settings-section">
                            <h3>General Settings</h3>
                            <div class="field">
                                <label class="label" for="workspace-name-input">Workspace name</label>
                                <input class="input" id="workspace-name-input" data-workspace-name-input type="text" placeholder="e.g., Demo Room" />
                            </div>
                        </div>
                    </div>

                    <!-- Retention Policy Tab -->
                    <div class="workspace-settings-tab-content" data-content="retention">
                        <div class="settings-section">
                            <h3>Document Retention Policy</h3>
                            <div class="field">
                                <label class="label" for="retention-days-input">Keep documents for</label>
                                <div class="input-with-suffix">
                                    <input class="input" id="retention-days-input" data-retention-days-input type="number" min="0" max="365" value="30" />
                                    <span class="input-suffix">days</span>
                                </div>
                                <div class="field-hint">Manual cleanup deletes documents older than this (0 keeps forever)</div>
                                <div class="field-error" data-retention-days-error>Document retention days must be between 0 and 365</div>
                            </div>

                            <div class="info-box">
                                <img class="themed-icon" src="assets/icons/info.svg" width="18" height="18" alt="">
                                <span>Changes to retention policy affect all printers in this workspace.</span>
                            </div>
                        </div>
                    </div>

                    <!-- Usage & Statistics Tab -->
                    <div class="workspace-settings-tab-content" data-content="usage">
                        <div class="settings-section">
                            <h3>Workspace Usage</h3>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <div class="stat-label">Total Printers</div>
                                    <div class="stat-value" data-stat-total-printers>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Total Documents</div>
                                    <div class="stat-value" data-stat-total-documents>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Documents (last 24h)</div>
                                    <div class="stat-value" data-stat-documents-24h>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Last Document Received</div>
                                    <div class="stat-value" data-stat-last-document>Never</div>
                                </div>
                            </div>
                            <div class="field" style="margin-top: 20px;">
                                <label class="label">Created at</label>
                                <div class="read-only-value" data-workspace-created-at></div>
                            </div>
                        </div>
                    </div>

                    <!-- Admin Statistics Tab -->
                    <div class="workspace-settings-tab-content" data-content="admin" data-admin-statistics-content hidden>
                        <div class="settings-section admin-statistics-section">
                            <h3>Admin Statistics</h3>
                            <div class="retention-cleanup-panel" data-retention-cleanup-panel hidden>
                                <h4>Document Retention Cleanup</h4>
                                <div class="retention-cleanup-summary" data-retention-cleanup-summary>
                                    0 documents retention 0 media files
                                </div>
                                <div class="field">
                                    <label class="label" for="retention-cleanup-limit-input">Documents to delete</label>
                                    <input
                                        class="input retention-cleanup-limit-input"
                                        id="retention-cleanup-limit-input"
                                        data-retention-cleanup-limit-input
                                        type="number"
                                        min="1"
                                        max="100000"
                                        value="500"
                                    />
                                    <div class="field-hint">Limits how many documents are deleted across all workspaces in one pass.</div>
                                    <div class="field-error" data-retention-cleanup-limit-error>
                                        Documents to delete must be greater than 0
                                    </div>
                                </div>
                                <button class="btn btn-secondary" data-retention-cleanup-run>
                                    <img class="themed-icon" src="assets/icons/trash-2.svg" width="16" height="16" alt="">
                                    Run Retention Cleanup
                                </button>
                            </div>
                            <div class="stats-grid admin-stats-grid">
                                <div class="stat-item">
                                    <div class="stat-label">Total Workspaces</div>
                                    <div class="stat-value" data-admin-total-workspaces>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Active Workspaces (24h)</div>
                                    <div class="stat-value" data-admin-active-workspaces-24h>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Active Workspaces (7d)</div>
                                    <div class="stat-value" data-admin-active-workspaces-7d>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Total Printers</div>
                                    <div class="stat-value" data-admin-total-printers>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Total Documents</div>
                                    <div class="stat-value" data-admin-total-documents>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Total Media</div>
                                    <div class="stat-value" data-admin-total-media>0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Media Size</div>
                                    <div class="stat-value" data-admin-total-media-bytes>0 B</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Documents (24h / 7d)</div>
                                    <div class="stat-value" data-admin-documents-window>0 / 0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Media (24h / 7d)</div>
                                    <div class="stat-value" data-admin-media-window>0 / 0</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">Last Document</div>
                                    <div class="stat-value" data-admin-last-document>Never</div>
                                </div>
                            </div>

                            <div class="admin-workspaces-table-wrap">
                                <table class="admin-workspaces-table">
                                    <thead>
                                        <tr>
                                            <th>Workspace</th>
                                            <th>Role</th>
                                            <th>Printers</th>
                                            <th>Docs</th>
                                            <th>Media</th>
                                            <th>Media size</th>
                                            <th>24h docs</th>
                                            <th>Retention</th>
                                            <th>Last document</th>
                                        </tr>
                                    </thead>
                                    <tbody data-admin-workspace-rows>
                                        <tr>
                                            <td colspan="9" class="admin-workspaces-empty">No workspace statistics</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>


                    <!-- IP Whitelist Tab -->
                    <div class="workspace-settings-tab-content" data-content="whitelist">
                        <div class="settings-section whitelist-section">
                            <h3>TCP IP Whitelist</h3>
                            <p class="whitelist-description">
                                Only allow listed IP addresses and ranges to connect to raw TCP printer ports.
                                Applies to all printers in this workspace.
                            </p>

                            <div class="field">
                                <label class="whitelist-toggle-label">
                                    <input type="checkbox" id="whitelist-enabled-checkbox" data-whitelist-enabled />
                                    Enable IP whitelist
                                </label>
                            </div>

                            <div class="field" data-whitelist-entries-field>
                                <label class="label" for="whitelist-entries-input">Allowed IPs / ranges</label>
                                <textarea
                                    class="input whitelist-textarea"
                                    id="whitelist-entries-input"
                                    data-whitelist-entries
                                    placeholder="192.168.1.0/24&#10;10.0.0.5&#10;2001:db8::/32"
                                    rows="6"
                                    spellcheck="false"
                                ></textarea>
                                <div class="field-hint">One entry per line. Accepts IPv4, IPv6, and CIDR notation (e.g. 192.168.1.0/24).</div>
                            </div>

                        </div>
                    </div>

                    <!-- Connections Tab -->
                    <div class="workspace-settings-tab-content" data-content="connections">
                        <div class="settings-section connections-section">
                            <h3>Recent Connections</h3>
                            <div class="whitelist-connections-header">
                                <select class="connections-time-select" data-connections-minutes>
                                    <option value="1">Last 1 minute</option>
                                    <option value="5">Last 5 minutes</option>
                                    <option value="15">Last 15 minutes</option>
                                    <option value="30">Last 30 minutes</option>
                                    <option value="60" selected>Last 1 hour</option>
                                    <option value="180">Last 3 hours</option>
                                    <option value="360">Last 6 hours</option>
                                    <option value="720">Last 12 hours</option>
                                    <option value="1440">Last 24 hours</option>
                                </select>
                                <button class="btn btn-secondary btn-sm" data-whitelist-refresh>Refresh</button>
                            </div>
                            <div class="whitelist-connections-list" data-whitelist-connections>
                                <div class="whitelist-connections-empty">No recent connections</div>
                            </div>
                        </div>
                    </div>

                    <!-- Danger Zone Tab -->
                    <div class="workspace-settings-tab-content" data-content="danger">
                        <div class="settings-section danger-section">
                            <h3>Delete Workspace</h3>
                            <p class="danger-description">
                                Once you delete a workspace, there is no going back. Please be certain.
                            </p>
                            <button class="btn btn-danger" data-delete-workspace-btn>
                                <img class="themed-icon" src="assets/icons/trash-2.svg" width="16" height="16" alt="">
                                Delete Workspace
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer workspace-settings-footer">
                <button class="btn btn-secondary" data-workspace-settings-cancel>Cancel</button>
                <button class="btn btn-primary" data-workspace-settings-save disabled>Save Changes</button>
            </div>
        </div>
    </div>
</template>
